<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="theme-color" content="#f76b9b"><title>Cupcake Cannibal Controller</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overscroll-behavior:none;user-select:none;-webkit-user-select:none;background:#f76b9b;color:#321a27;font-family:system-ui,sans-serif}body{padding:env(safe-area-inset-top) 22px env(safe-area-inset-bottom);text-align:center}button,input{font:inherit;border:0;border-radius:22px}button{font-weight:850;cursor:pointer;background:#fff4df;color:#492038;box-shadow:0 7px 0 #b95778;padding:18px 22px}button:active,.pressed{transform:translateY(5px);box-shadow:0 2px 0 #b95778!important}button:disabled{opacity:.6}input{display:block;margin:22px auto;padding:18px;text-align:center;font-size:28px;letter-spacing:8px;text-transform:uppercase;width:230px;background:#fff8ed;user-select:text;-webkit-user-select:text}h1{font-size:34px;line-height:1.02;letter-spacing:-1px;margin:28px 0 12px}p{line-height:1.5}.eyebrow{font-size:11px;font-weight:800;letter-spacing:3px;margin:22px 0 10px}.hidden{display:none!important}#join{padding-top:8vh}#message{font-size:14px;min-height:50px}#status{font-size:12px;font-weight:750;letter-spacing:1px;margin-top:18px}#dot{display:inline-block;background:#ab314d;border:2px solid #fff3dc;border-radius:50%;width:12px;height:12px;margin-right:7px}.online{background:#4bba85!important}.pips{display:flex;justify-content:center;gap:9px;margin:20px}.pip{width:32px;height:28px;border-radius:50% 50% 30% 30%;background:#fff0d5;box-shadow:0 4px 0 #a84968}.pip.empty{opacity:.25}.controls{display:grid;grid-template-columns:1fr 1.3fr;align-items:center;gap:16px;height:38vh}#hit{height:220px;max-height:34vh;border-radius:50%;font-size:38px;letter-spacing:-1px;background:#fff1c8;box-shadow:0 12px 0 #ad4267}#joystick{width:140px;height:140px;border-radius:50%;background:#ffffff30;border:3px solid #fff2d799;position:relative;margin:auto}#thumb{width:54px;height:54px;border-radius:50%;background:#fff1c8;position:absolute;left:40px;top:40px;pointer-events:none}#tilt{font-size:44px;line-height:1.3}small{display:block;font-size:12px;font-weight:750;letter-spacing:1px}#ready,#rematch{width:100%;margin-top:20px}#calibrate{margin-top:12px;font-size:12px;padding:10px;background:#ffffff55;box-shadow:none}#landscape{display:none;position:fixed;inset:0;background:#321a27;color:#fff4de;z-index:20;align-items:center;justify-content:center;padding:30px;font-size:26px;font-weight:800}@media(orientation:landscape){#landscape{display:flex}}@media(max-height:720px){h1{font-size:28px;margin-top:15px}.controls{height:34vh}#hit{height:180px}#join{padding-top:1vh}}
</style></head><body>
<section id="join"><p class="eyebrow">A LITTLE BAKERY BRAWL</p><h1>CUPCAKE<br>CANNIBAL</h1><p>Find the room code on the game screen.</p><input id="room" maxlength="4" placeholder="ROOM" aria-label="Room code" autocomplete="off" autocapitalize="characters"><button id="enable">Enable Motion & Join</button><p id="message">Tilt to move. Tap HIT to chomp.</p></section>
<section id="game" class="hidden"><div id="status"><span id="dot"></span><span id="connection">CONNECTING</span></div><p class="eyebrow">YOUR CUPCAKE</p><h1 id="name">STRAWBERRY</h1><div class="pips" id="pips" aria-label="Five frosting pips"></div><div class="controls"><div><div id="tilt">↔<small>TILT GENTLY</small></div><div id="joystick" class="hidden" aria-label="Touch movement joystick"><div id="thumb"></div></div></div><button id="hit" disabled>HIT!</button></div><p id="hint">Hold comfortably, then tap Ready.</p><button id="ready">READY — SET NEUTRAL TILT</button><button id="calibrate" class="hidden">Recenter tilt</button><button id="rematch" class="hidden">ONE MORE BITE — REMATCH</button></section>
<div id="landscape">Turn your phone upright to play.</div><script src="play.js" type="module"></script></body></html>
